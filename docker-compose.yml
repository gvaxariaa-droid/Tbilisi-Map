# Local full stack:  docker compose up --build   then open http://localhost:8080
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: tpm
      POSTGRES_USER: tpm
      POSTGRES_PASSWORD: tpm-local-password
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpm -d tpm"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      NODE_ENV: production
      TRUST_PROXY: "0"
      DATABASE_URL: postgres://tpm:tpm-local-password@db:5432/tpm
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your shell or a .env file (openssl rand -hex 32)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STORAGE_DRIVER: local
    volumes: [uploads:/data/uploads]

volumes:
  db-data:
  uploads:
